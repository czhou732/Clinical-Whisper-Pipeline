<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicalWhisper</title>
    <!-- No remote font/CDN requests: this app must work fully offline, and a
         clinical tool should not phone out to Google while handling PHI.
         style.css falls back to system faces (Avenir Next, Didot, SFMono). -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>ClinicalWhisper</h1>
            <p class="subtitle">Offline Audio Processing Pipeline</p>
        </header>

        <main>
            <div class="panel">
                <div class="upload-zone" id="drop-zone">
                    <div class="upload-content">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <p><strong>Drag &amp; Drop</strong> one or more clinical audio files</p>
                        <p class="text-sm">or click to select files (.wav, .m4a, .mp3, .mp4)</p>
                    </div>
                    <input type="file" id="file-input" accept=".wav,.m4a,.mp3,.mp4" multiple hidden>
                </div>

                <div class="selected-files hidden" id="file-info">
                    <div class="file-list-header">
                        <span id="file-count">0 files selected</span>
                        <button class="btn-clear" id="btn-clear">Clear all</button>
                    </div>
                    <ul class="file-list" id="file-list"></ul>
                </div>

                <div class="study-meta">
                    <input type="text" id="participant-id" placeholder="Participant ID (optional)">
                    <input type="text" id="session-label" placeholder="Session (optional)">
                </div>

                <button class="btn-primary" id="btn-process" disabled>Process Audio</button>
            </div>

            <div class="console-panel hidden" id="console-panel">
                <div class="console-header">
                    <span class="status-indicator processing" id="status-dot"></span>
                    <span id="status-text">Processing Pipeline...</span>
                    <span class="progress-count" id="progress-count"></span>
                    <button class="btn-cancel" id="btn-cancel">Stop</button>
                </div>
                <div class="stage-line"><span id="stage-label"></span><span id="stage-detail"></span></div>
                <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
                <div class="console-output" id="console-output"></div>
            </div>

            <div class="result-panel hidden" id="result-panel">
                <div class="result-header">
                    <h3>Clinical Analysis Results</h3>
                    <div class="export-group">
                        <span class="text-sm">Save as</span>
                        <button class="btn-secondary" data-fmt="csv">CSV</button>
                        <button class="btn-secondary" data-fmt="json">JSON</button>
                        <button class="btn-secondary" data-fmt="md">Report</button>
                    </div>
                </div>

                <div class="result-tabs" id="result-tabs"></div>

                <div class="roles-bar hidden" id="roles-bar">
                    <span class="text-sm">Speakers:</span>
                    <span id="roles-summary" class="roles-summary"></span>
                    <button class="btn-secondary" id="btn-swap-roles">Swap roles &amp; re-score</button>
                </div>

                <div class="view-switch" id="view-switch">
                    <button class="view-btn active" data-view="scores">Scores</button>
                    <button class="view-btn" data-view="transcript">Transcript</button>
                    <button class="view-btn" data-view="json">JSON</button>
                </div>

                <div id="view-scores" class="result-view">
                    <div id="result-content" class="result-grid"></div>
                    <div id="impression-block"></div>
                </div>
                <div id="view-transcript" class="result-view hidden">
                    <pre class="text-block" id="transcript-content"></pre>
                </div>
                <div id="view-json" class="result-view hidden">
                    <pre class="text-block" id="json-content"></pre>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
