# ============================================================
# ClinicalWhisper Configuration
# ============================================================
# Copy this file to config.yaml and edit paths for your system:
#   cp config.example.yaml config.yaml

# Whisper model: tiny.en | base.en | small.en | medium.en | large-v3
model: "small.en"
# MLX-optimized model repo (Apple Silicon native — 4-10x faster)
mlx_model: "mlx-community/whisper-small.en-mlx"


# Folders (relative to this file, or absolute paths)
input_folder: "./Input"
processed_folder: "./Processed"

# Where to save Markdown notes
output_folder: "./Output"

# Supported audio extensions
audio_extensions:
  - ".m4a"
  - ".mp3"
  - ".wav"
  - ".ogg"      # Plaud recorder exports
  - ".opus"
  - ".flac"
  - ".aac"
  - ".mp4"

# Sentiment analysis
sentiment:
  enabled: true
  sentences_per_segment: 5   # how many sentences per analysis chunk

# Transcript statistics
statistics:
  enabled: true               # word count, duration estimate, etc.

# Acoustic features
acoustic_features:
  enabled: true               # extracts F0, Energy, VTA via OpenSMILE eGeMAPSv02

# Keep the transcription and scoring models in memory between batches.
# false (default) releases them when a batch finishes, so an idle app holds a
# few hundred MB instead of ~5 GB. The cost is ~10 s of model loading on the
# next batch. Set true when working through many files back to back.
keep_models_loaded: false

# What to do with the source audio once an analysis is written.
#   archive -> move it to processed_folder (default; keeps the recording)
#   delete  -> remove it, so nothing identifiable is left on disk
#   keep    -> leave it where it is (the command-line batch default, since it
#              runs over a study's original recordings)
# The transcript is de-identified either way, but the audio itself is not.
audio_retention: "archive"

# Duplicate protection
skip_already_processed: true   # skip files that already have a note in output

# Speaker diarization (identifies WHO is speaking)
# Requires: pip install pyannote.audio
# And a HuggingFace token from https://huggingface.co/settings/tokens
# You must also accept terms at https://huggingface.co/pyannote/speaker-diarization-3.1
diarization:
  enabled: true
  hf_token: ""                 # leave empty — set HF_TOKEN env var instead
  min_speakers: 2
  max_speakers: 6

# Async pipeline (ingestion API + queue + background workers)
pipeline:
  queue_db_path: "./clinicalwhisper_jobs.db"
  secure_storage_folder: "./Input/ingestion"
  analysis_output_folder: "./Output"
  poll_interval_seconds: 1.0
  max_workers: 1

# Plaud Note integration
plaud:
  enabled: false
  # Directories to watch for Plaud audio/transcription files
  watch_paths:
    - "/Volumes/PLAUD*"              # USB mount (glob pattern)
    - "~/Downloads/PlaudExports"     # App export folder
  # How to submit to Clinical Whisper: "api" or "direct"
  ingestion_mode: "direct"
  api_url: "http://127.0.0.1:8000/jobs"
  # Audio extensions to ingest
  audio_extensions: [".mp3", ".wav", ".m4a"]
  # Optional: also ingest text transcription files
  ingest_transcriptions: false
  transcript_extensions: [".txt", ".srt"]
  # Deduplication DB
  db_path: "./plaud_ingested.db"
  # Poll interval for USB mount detection (seconds)
  usb_poll_interval: 5
  # Archive ingested files instead of leaving them
  archive_after_ingest: true
  archive_folder: "./PlaudArchive"

# Meeting Intelligence — local LLM meeting summary extraction
# Run: python meeting_intel.py --file path/to/transcript.md
meeting_intel:
  enabled: false
  # Must be pulled locally first: ollama pull gpt-oss:20b
  ollama_model: "gpt-oss:20b"
  ollama_base_url: "http://localhost:11434"
  # Timeout in seconds
  timeout_seconds: 180
  max_retries: 1
  summary_suffix: "_summary"
  min_word_count: 50

# ============================================================
# v4.0 — LLM Clinical Analysis (requires Ollama running locally)
# ============================================================

# LLM Clinical Scoring — structured interview assessment
# Scores hesitancy, affect flatness, engagement, elaboration, psychomotor indicators
# Runs fully on-device: MLX on Apple Silicon, HuggingFace transformers elsewhere.
# Weights (~4.5 GB) download to ~/.cache/huggingface on first use.
llm_scoring:
  enabled: true
  mlx_model: "mlx-community/Meta-Llama-3-8B-Instruct-4bit"   # Apple Silicon
  hf_model: "NousResearch/Meta-Llama-3-8B-Instruct"          # Windows/Linux/Intel (ungated)
  # The old 4096 cap made the model ramble long past its answer — 68s of
  # generation instead of ~21s, for identical scores. If responses are being
  # truncated (a warning is logged), raise this.
  max_tokens: 1200
  timeout_seconds: 300
  max_retries: 1
  # Long interviews are scored in windows and the results averaged, rather than
  # truncated. ~2800 words is what fits alongside the prompt in Llama-3's 8K
  # context. Per-window scores are kept in the analysis JSON.
  window_words: 2800
  # "dialogue" scores the full exchange; "subject_only" drops the interviewer's
  # turns. Note engagement_level is an interactional judgement and means
  # something different without the questions.
  transcript_scope: "dialogue"
  # Re-scores each window and reports the mean (and SD). A single score is one
  # draw from a wide distribution: measured test-retest ICC was 0.22-0.60
  # (evals/reports/reliability.md). Averaging k runs raises it by the
  # Spearman-Brown formula; k=5 predicts ~0.58-0.88. Run 1 stays greedy and
  # reproducible; the rest use `temperature`. Costs ~5x the scoring time —
  # set 1 for a quick look, keep 5 for anything you will analyse.
  samples: 5
  temperature: 0.7

# ============================================================
# v5.0 — MOSS transcription + OpenMED de-identification
# ============================================================

# Joint transcription and diarization. Public model, no HF token required.
# Weights (~1.7 GB) download to ~/.cache/huggingface on first use.
moss:
  model: "OpenMOSS-Team/MOSS-Transcribe-Diarize"
  device: "auto"        # auto | mps | cuda | cpu
  # Domain terms the transcriber should favour — drug names, scale names, local
  # jargon. Appended to the model's prompt as hotwords.
  # A general transcriber mangles clinical vocabulary ("anhedonia" came out as
  # "Adonia" on a journal-club recording). Add your own drug, scale and site names.
  hotwords: [anhedonia, anhedonic, PHQ-8, PHQ-9, SHAPS, DARS, TEPS, MADRS,
             HAM-D, DAIC-WOZ, ketamine, dopamine, ventral striatum,
             nucleus accumbens, eGeMAPS, openSMILE, ClinicalWhisper, PRAXIS]
  # auto picks float16 on Apple Silicon (~2.4x faster than float32, identical
  # output in testing). Set float32 if a recording ever transcribes poorly.
  dtype: "auto"         # auto | float16 | bfloat16 | float32
  # Apple Silicon only: the text decoder runs on MLX, several times faster than
  # PyTorch. "torch" forces the old path (and is what CUDA machines use).
  backend: "auto"       # auto | mlx | torch
  # Long recordings are split into equal overlapping windows decoded as one
  # batch. One pass over an hour both slows to a crawl (every token attends to
  # the whole file) and, measured on a 29-min meeting, silently dropped the
  # last 3 minutes. Windows shorter than ~3 min hurt diarization.
  window_seconds: 300
  window_overlap_seconds: 30
  # Upper bound; the real batch is also capped by memory — a quarter of RAM,
  # and 60% of what is free when the job starts — because a batch that spills
  # into swap runs an order of magnitude slower.
  batch_size: 32
  # Cosine similarity needed to treat voices in different windows as the same
  # speaker when the overlap alone does not settle it. Leave unset: defaults are
  # tuned per embedding type (voice model vs encoder fallback) on AMI.
  # speaker_similarity: 0.50
  # Whole-file pass: merge two speakers only if their voices are this similar
  # AND they never talk in the same window. Fixes one person being split in
  # two after a long silence without merging distinct people.
  # speaker_merge_similarity: 0.65
  # MOSS sometimes labels one person twice within a window; labels whose voices
  # match at least this closely are joined anyway (tuned on AMI).
  # speaker_split_similarity: 0.75
  # Set when every recording has the same number of speakers — 2 for a
  # one-to-one clinical interview. Long recordings are otherwise prone to one
  # person being given two labels; this folds extras into the nearest voice.
  # Leave unset for groups or when the count varies.
  # num_speakers: 2

# HIPAA Safe Harbor de-identification of the transcript.
# strict: true means a scrubber failure aborts the job rather than emitting
# an unscrubbed transcript.
pii_scrubbing:
  enabled: true
  confidence_threshold: 0.7
  strict: true

# Clinical Question Detection — categorizes interviewer probes
# Categories: positive_affect, negative_affect, ptsd_screen, social_functioning,
#   daily_functioning, coping_strategies, suicidal_ideation, rapport_building, follow_up
question_detection:
  enabled: false
  ollama_model: "qwen2:7b"
  ollama_base_url: "http://localhost:11434"
  timeout_seconds: 300

# LLM Embedding Extraction — deep feature vectors for downstream ML
# Exports segment embeddings as CSV or NumPy files for researchers
embeddings:
  enabled: false                 # off by default (research feature)
  model: "sentence-transformers/all-MiniLM-L6-v2"
  pooling: "mean"                # or "cls"
  export_format: "csv"           # or "npy"

