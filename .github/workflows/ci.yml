name: ClinicalWhisper CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One failing version should not hide the others' results.
      fail-fast: false
      matrix:
        # Matches requires-python: onnxruntime>=1.24.3 has no 3.10 wheels, so
        # a 3.10 job could never install the package.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Download NLTK data
        run: python -c "import nltk; nltk.download('punkt_tab')"

      - name: Download the sentiment model
        run: python -c "from huggingface_hub import snapshot_download; snapshot_download('cardiffnlp/twitter-roberta-base-sentiment-latest')"
        # The app runs offline (offline.lock), so tests can only load models
        # that are already in the Hugging Face cache.

      - name: Run tests
        run: pytest tests/ -v -k "not acoustic"
        # Skip acoustic feature tests — opensmile requires system-level deps
        # that are not available in the CI runner.

      - name: Run clinical eval self-test
        run: python evals/run_clinical_evals.py --self-test
        # Model-free path: validates the golden dataset schema, the expected
        # bands, and the assertion logic. The full eval scores an 8B local LLM
        # and cannot run on a hosted Ubuntu runner — it gates at pre-commit on
        # a machine with the model. See evals/README.md.
