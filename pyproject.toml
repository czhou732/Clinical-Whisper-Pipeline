[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinicalwhisper"
version = "3.0.0"
description = "Privacy-first clinical speech analysis pipeline"
authors = [
    { name = "Chengdong Zhou" },
]
license = "MIT"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    "openai-whisper",
    "watchdog",
    "pyyaml",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "streamlit",
    "pandas",
    "plotly",
    "opensmile",
    "soundfile",
    "transformers>=4.35.0",
    "torch>=2.0.0",
    "sentencepiece",
    "nltk",
    "openmed>=1.9.0",
    "mlx-lm",
    "torchaudio",
    "pywebview",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
diarization = [
    "moss-transcribe-diarize @ git+https://github.com/OpenMOSS/MOSS-Transcribe-Diarize.git",
]

[project.scripts]
clinicalwhisper = "main:main"

[project.urls]
Repository = "https://github.com/czhou732/Clinical-Whisper-Pipeline"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["www*", "evals*", "tests*", "scripts*", "Input*", "Output*", "Processed*"]
